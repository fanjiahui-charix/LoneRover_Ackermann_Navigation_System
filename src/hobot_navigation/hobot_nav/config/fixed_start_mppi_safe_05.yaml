local_costmap:
  local_costmap:
    ros__parameters:
      width: 4
      height: 4
      plugins:
      - static_layer
      - inflation_layer
      - cone_layer
      footprint: '[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]'
      footprint_padding: 0.0
      inflation_layer:
        inflation_radius: 0.03
        cost_scaling_factor: 17.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      resolution: 0.01
      plugins:
      - static_layer
      - inflation_layer
      - gate_side_soft_layer
      - cone_layer
      footprint: '[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]'
      footprint_padding: 0.0
      inflation_layer:
        inflation_radius: 0.03
        cost_scaling_factor: 15.0
      gate_side_soft_layer:
        plugin: lidar_perception::GateSideSoftLayer
        enabled: true
        left_mesh_inner_x: 2.0
        right_mesh_inner_x: 3.0
        y_min: 2.0
        y_max: 2.9
        band_width: 0.1
        maximum_cost: 220
      cone_layer:
        plugin: lidar_perception::ConeLayer
        enabled: true
        topic: /cones/points
        effective_radius: 0.13
        ttl_sec: 0.8
        tf_tolerance_sec: 0.1
planner_server:
  ros__parameters:
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      downsample_costmap: true
      downsampling_factor: 4
      angle_quantization_bins: 144
      minimum_turning_radius: 0.35
      cost_penalty: 3.2
      non_straight_penalty: 1.225
      change_penalty: 0.1
      retrospective_penalty: 0.015
      tolerance: 0.08
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      max_planning_time: 2.0
behavior_server:
  ros__parameters:
    behavior_plugins:
    - backup
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
controller_server:
  ros__parameters:
    goal_checker_plugins:
    - general_goal_checker
    - QrRegionGoalChecker
    - GateEntryGoalChecker
    controller_frequency: 10.0
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.02
      movement_time_allowance: 120.0
    general_goal_checker:
      xy_goal_tolerance: 0.08371
      yaw_goal_tolerance: 0.35
    QrRegionGoalChecker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.14
      stateful: false
    GateEntryGoalChecker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.349066
      stateful: false
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      model_dt: 0.1
      time_steps: 22
      batch_size: 600
      iteration_count: 1
      vx_min: 0.0
      vx_max: 0.5
      vy_max: 0.0
      wz_max: 1.5
      vx_std: 0.15006
      vy_std: 0.0
      wz_std: 0.25686
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.30215
      gamma: 0.01887
      visualize: false
      regenerate_noises: true
      AckermannConstraints:
        min_turning_r: 0.35
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.16732
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.5772
        threshold_to_consider: 0.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.3
        offset_from_furthest: 6
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.72655
        offset_from_furthest: 6
        threshold_to_consider: 0.3
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.3
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    controller_plugins:
    - FollowPath
    - FollowPathReverse
    - FollowPathChannel
    FollowPathReverse:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      model_dt: 0.1
      time_steps: 22
      batch_size: 600
      iteration_count: 1
      vx_min: -0.25
      vx_max: 0.0
      vy_max: 0.0
      wz_max: 1.5
      vx_std: 0.15006
      vy_std: 0.0
      wz_std: 0.25686
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.30215
      gamma: 0.01887
      visualize: false
      regenerate_noises: true
      AckermannConstraints:
        min_turning_r: 0.35
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.16732
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.5772
        threshold_to_consider: 0.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.3
        offset_from_furthest: 6
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.72655
        offset_from_furthest: 6
        threshold_to_consider: 0.3
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.3
        max_angle_to_furthest: 1.0
        forward_preference: false
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    FollowPathChannel:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.78
      lookahead_dist: 0.28
      min_lookahead_dist: 0.22
      max_lookahead_dist: 0.46
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8
      allow_reversing: false
      use_rotate_to_heading: false
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 1.0
      use_interpolation: true
velocity_smoother:
  ros__parameters:
    max_velocity:
    - 0.5
    - 0.0
    - 1.5
    min_velocity:
    - -0.25
    - 0.0
    - -1.5
    max_accel:
    - 0.53129
    - 0.0
    - 2.0
    max_decel:
    - -0.76369
    - 0.0
    - -2.0
    feedback: OPEN_LOOP
    scale_velocities: false
    velocity_timeout: 0.3
competition_command_limiter:
  ros__parameters:
    input_topic: /cmd_vel_nav
    output_topic: /cmd_vel_safe
    reverse_only_topic: /race/qr_escape_reverse_only
    direct_gate_topic: /race/direct_gate_active
    direct_gate_speed_limit_mps: 0.25
    profile_max_speed: 0.5
    profile_max_reverse_speed: 0.25
    lateral_accel_limit: 0.8
    min_turning_radius: 0.35
