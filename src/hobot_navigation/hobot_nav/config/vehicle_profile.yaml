# 这一份是“实车真值优先”的集中覆盖层。
# 以后需要改车体外参、footprint、最小转弯半径、近距防撞区时，
# 优先改这里，而不是四处翻 launch / nav2_params / collision_monitor。

static_frames_publisher:
  ros__parameters:
    # 平时如果 origincarpro_base 已经在发静态 TF，这两个开关保持 false。
    # 只有你临时不启底盘驱动、但又想让导航侧兜底补 TF 时，才打开。
    publish_imu_tf: false
    imu.parent_frame: base_link
    imu.child_frame: imu_link
    imu.x: 0.019
    imu.y: -0.036
    imu.z: 0.048
    imu.roll: 0.0
    imu.pitch: 0.0
    imu.yaw: 0.0

    publish_laser_tf: false
    laser.parent_frame: base_link
    laser.child_frame: laser_link
    laser.x: 0.067
    laser.y: 0.0
    laser.z: 0.146
    laser.roll: 0.0
    laser.pitch: 0.0
    laser.yaw: 0.0


local_costmap:
  local_costmap:
    ros__parameters:
      # Single formal footprint contract: 0.28/0.11/0.13 m, no extra padding.
      footprint: "[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]"
      footprint_padding: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]"
      footprint_padding: 0.0

planner_server:
  ros__parameters:
    GridBased:
      # 没有实测最小转弯半径前，先保守一点。
      minimum_turning_radius: 0.35

controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.20
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.70
      approach_velocity_scaling_dist: 0.8
      regulated_linear_scaling_min_radius: 0.35
      regulated_linear_scaling_min_speed: 0.10
      max_angular_accel: 1.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.25, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel: [0.40, 0.0, 1.0]
    max_decel: [-0.50, 0.0, -1.0]

collision_monitor:
  ros__parameters:
    # Keep the centralized overlay from reintroducing broad legacy zones.
    # The base collision-monitor config owns the single scan/footprint guard.
    FootprintApproach:
      enabled: true
