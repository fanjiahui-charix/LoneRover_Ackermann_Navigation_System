# 兼容旧命令的 fixed-start RPP 0.5 m/s 覆盖层。
# 新入口优先使用 fixed_start_rpp_safe_05.yaml；此文件保留给已有脚本。

static_frames_publisher:
  ros__parameters:
    publish_imu_tf: false
    imu.parent_frame: base_link
    imu.child_frame: imu_link
    imu.x: 0.019
    imu.y: -0.036
    imu.z: 0.048
    imu.roll: 0.0
    imu.pitch: 0.0
    imu.yaw: 0.0

    publish_laser_tf: false
    laser.parent_frame: base_link
    laser.child_frame: laser_link
    laser.x: 0.067
    laser.y: 0.0
    laser.z: 0.146
    laser.roll: 0.0
    laser.pitch: 0.0
    laser.yaw: 0.0

    publish_camera_tf: false
    camera.parent_frame: base_link
    camera.child_frame: camera_link
    camera.x: 0.0
    camera.y: 0.0
    camera.z: 0.0
    camera.roll: 0.0
    camera.pitch: 0.0
    camera.yaw: 0.0

    publish_camera_optical_tf: false
    camera_optical.parent_frame: camera_link
    camera_optical.child_frame: camera_optical_frame
    camera_optical.x: 0.0
    camera_optical.y: 0.0
    camera_optical.z: 0.0
    camera_optical.roll: -1.5707963267948966
    camera_optical.pitch: 0.0
    camera_optical.yaw: -1.5707963267948966

local_costmap:
  local_costmap:
    ros__parameters:
      # Single formal footprint contract: 0.28/0.11/0.13 m, no extra padding.
      footprint: "[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]"
      footprint_padding: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.28, 0.13], [0.28, -0.13], [-0.11, -0.13], [-0.11, 0.13]]"
      footprint_padding: 0.0

planner_server:
  ros__parameters:
    GridBased:
      minimum_turning_radius: 0.35

controller_server:
  ros__parameters:
    goal_checker_plugins: ["general_goal_checker", "QrRegionGoalChecker", "GateEntryGoalChecker"]
    general_goal_checker:
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35
    QrRegionGoalChecker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.14
      stateful: false
    GateEntryGoalChecker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.349066
      stateful: false
    FollowPath:
      desired_linear_vel: 0.50
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.70
      approach_velocity_scaling_dist: 0.8
      regulated_linear_scaling_min_radius: 0.35
      regulated_linear_scaling_min_speed: 0.10
      max_angular_accel: 1.0

velocity_smoother:
  ros__parameters:
    # 给 0.50 m/s 目标留少量数值余量；不开放倒车。
    max_velocity: [0.55, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel: [0.40, 0.0, 1.0]
    max_decel: [-0.50, 0.0, -1.0]
