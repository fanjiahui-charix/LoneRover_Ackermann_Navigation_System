### Stage 13 wheel + IMU fallback (Stage 6 balanced_dynamic).
### Wheel wz remains available only as an event-classification context signal.

ekf_fusion_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    # Publish odom->base_link at the EKF timer's current time instead of the
    # last queued sensor stamp. This keeps scan-time TF available under load
    # without future-dating the transform or changing measurement fusion.
    predict_to_current_time: true
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    debug_out_file: /tmp/ekf_fusion_debug.txt
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom/data_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_pose_rejection_threshold: 200.0
    imu0_twist_rejection_threshold: 5.0
    imu0_linear_acceleration_rejection_threshold: 10.0
    imu0_remove_gravitational_acceleration: false

    use_control: false
    # Stable base Q; only the three Stage 6 rare events temporarily scale it.
    dynamic_process_noise_covariance: false

    real_vehicle_tweaks.enabled: true
    real_vehicle_tweaks.odom_linear_deadzone: 0.006303495707
    real_vehicle_tweaks.imu_yaw_rate_deadzone: 0.0005564782354
    real_vehicle_tweaks.imu_yaw_rate_covariance_base: 0.03115996343
    real_vehicle_tweaks.imu_yaw_rate_covariance_high_dynamic: 0.03771060068
    real_vehicle_tweaks.sensor_freshness_timeout: 0.2
    real_vehicle_tweaks.accel_dynamic_threshold: 3.859514307
    real_vehicle_tweaks.wheel_accel_threshold: 2.621150216
    real_vehicle_tweaks.wheel_imu_disagreement_threshold: 0.8143556116
    real_vehicle_tweaks.process_accel_multiplier: 1.251034404
    real_vehicle_tweaks.process_disagreement_multiplier: 0.1906219574
    real_vehicle_tweaks.wheel_vx_covariance_base: 0.04491191328
    real_vehicle_tweaks.wheel_vx_accel_multiplier: 1.703947
    real_vehicle_tweaks.wheel_vx_disagreement_multiplier: 0.345853
    real_vehicle_tweaks.wheel_vy_covariance_base: 1.366735788e-06

